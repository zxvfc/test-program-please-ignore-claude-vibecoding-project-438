# Величина боли считается через время: только два из пяти собеседников
# (Дмитрий и Елена) реально ведут ручную сверку лояльности по нескольким
# точкам на регулярной основе — это и есть наш ICP, остальные (Анна, Марина,
# Игорь) либо не считают статистику болью, либо уже отказались платить за
# её решение. Медиана считается по этим двум, а не по всей выборке.
#
# Сравнение с прямыми конкурентами (discovery/competitors.md, цены на
# 07.09.2026): UDS Lite — 4000 ₽/мес, GetMeBack Cards — 5592 ₽/мес. Наша
# цена 590 ₽/мес заметно ниже обоих — это осознанный выбор, а не ошибка:
# UDS и GetMeBack продают универсальный конструктор лояльности для любого
# малого бизнеса, а мы — тонкий продукт под один сценарий (кофе с собой,
# отметки покупок) для точки с 1-3 кассами, чей месячный бюджет на такие
# вещи по интервью в разы меньше, чем у их целевого сегмента.
pricing:
  currency: RUB
  pain_value_per_month: 4000     # величина боли в месяц
  how: Медиана по Дмитрию и Елене — единственным, кто реально ведёт ручную сверку лояльности по нескольким точкам — около 4 часов в месяц с учётом разбора ошибок; час времени управляющего оценён в 1000 ₽, так как сами респонденты эту цифру не называли
  price: 590                     # 14.75% от pain_value_per_month, попадает в коридор 10-20% (400-800)
  users_month_3: 25              # см. комментарий ниже про источник лидов
  revenue_month_3: 14750         # price * users_month_3
  evidence:
    - source: interviews/02-dmitry.md
      quote: Если считать сбор тетрадей, сверку с чеками и внесение в таблицу — часа три-четыре в месяц, плюс нервы, когда не сходится
    - source: interviews/05-elena.md
      quote: Если считать еженедельный сбор — примерно четыре раза по 40-60 минут, то есть часа три в месяц минимум, плюс разбор нештатных ситуаций типа той ошибки с периодом

# Откуда 25 платящих к третьему месяцу: сама выборка из пяти интервью уже
# даёт тёплые контакты на 4-5 соседних точек (у Анны — две соседние точки
# и контакт Кати, у Игоря — три соседних ларька, у Дмитрия — знакомый с
# тремя точками шаурмы, у Елены — коллега с сетью пекарен на iiko). При
# продолжении того же ручного поиска через карты и соцсети (см. idea.md)
# на плотность точек кофе с собой у метро в одном городе — реалистичная
# воронка холодного охвата: около 150-200 контактов за три месяца силами
# одного основателя, конверсия в демо около 25-30%, из демо в оплату —
# около 40-50% (конверсия высокая, потому что цена ниже одной боли клиента
# и продукт закрывает уже названную ими проблему). Итог — 25 платящих,
# круглое число не выбиралось произвольно, а получено из этой цепочки и
# намеренно взято по нижней границе диапазона (25-35), а не по верхней.
