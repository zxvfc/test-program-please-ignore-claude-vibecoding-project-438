findings:
  - id: loyalty-roi-anxiety
    claim: |
      Владельцы точек боятся, что бесплатные или скидочные напитки по программе
      лояльности раздаются впустую, и не решаются вводить или продолжать
      программу, пока не уверены в её окупаемости
    evidence:
      - source: interviews/02-dmitry.md
        quote: Я бы не понимал, работает ли программа лояльности вообще, окупается ли бесплатный восьмой кофе через возврат клиентов, или я просто дарю кофе просто так
      - source: interviews/04-igor.md
        quote: оказалось, процентов десять от всех покупателей, и я решил, что не окупается для одного ларька, отключил
      - source: interviews/01-anna.md
        quote: Скидку так и не ввела, потому что не была уверена в цифрах, побоялась, что посчитаю неправильно и уйду в минус

  - id: manual-data-reconciliation
    claim: |
      Владельцы нескольких точек вручную сводят данные о лояльности из разных
      источников — тетради, кассовые чеки, отчёты кассы, — и это отнимает часы
      и приводит к ошибкам
    evidence:
      - source: interviews/02-dmitry.md
        quote: чтобы данные сами стекались в одно место без ручного ввода, вот это была бы реальная экономия времени
      - source: interviews/05-elena.md
        quote: Главная сложность — Iiko не даёт сводный отчёт сразу по нескольким точкам в разрезе, который мне нужен, приходится выгружать по одной и вручную сводить
      - source: interviews/05-elena.md
        quote: мне важна не просто цифра по лояльности, а чтобы её можно было сразу сопоставить с выручкой и средним чеком, без ручного сведения из разных систем, это моя основная головная боль

  - id: speed-over-analytics
    claim: |
      Для точек с высокой проходимостью скорость обслуживания в очереди важнее
      любой аналитики, и решение отклоняется, если оно тормозит кассу
    evidence:
      - source: interviews/04-igor.md
        quote: Всё, что заставляет клиента задерживаться у кассы дольше десяти секунд, я в итоге бросаю, как бы хорошо оно ни считало статистику
      - source: interviews/04-igor.md
        quote: Если клиент сам сканирует QR на телефон без моего участия — это плюс, потому что не отнимает моё время. Если опять мне нужно будет что-то вбивать руками — я, скорее всего, откажусь, как и с прошлым приложением
      - source: interviews/02-dmitry.md
        quote: люди спешат, им некогда сканировать QR и регистрироваться, плюс это стоило какие-то деньги в месяц за подписку

  - id: lost-physical-card
    claim: |
      Потеря бумажной карты клиентом обнуляет историю его посещений, и владелец
      считает это более серьёзной проблемой, чем отсутствие статистики
    evidence:
      - source: interviews/01-anna.md
        quote: мне не так важна статистика сама по себе, важнее, чтобы карточки не терялись у людей, вот это реальная боль
      - source: interviews/01-anna.md
        quote: Человек ходит ко мне полгода, а у него уже третья по счёту карта, потому что предыдущие две потерял. И я это не могу отследить, для меня это просто новый человек с нуля

  - id: reporting-driven-by-stakeholder
    claim: |
      Регулярный сбор статистики по лояльности поддерживается в первую очередь
      необходимостью отчитываться перед собственником, а не личным интересом к
      цифрам
    evidence:
      - source: interviews/05-elena.md
        quote: Собственник бы не видел динамику по лояльности, а для него это один из показателей, по которому он решает, вкладываться ли в маркетинг на конкретной точке или нет
      - source: interviews/05-elena.md
        quote: Собственник на созвоне спросил, не закрывать ли нам точку, раз показатель так упал, и я потратила ещё полчаса вечером, чтобы перепроверить и написать отдельное сообщение, что это ошибка в выгрузке, а не реальное падение

  - id: distrust-of-paid-solutions
    claim: |
      Респонденты уже платили за готовые модули лояльности и отказались от них,
      посчитав стоимость неоправданной относительно фактического использования
    evidence:
      - source: interviews/02-dmitry.md
        quote: Да, за то приложение платил около 1500 в месяц за две точки, три месяца продержался, потом отказался, посчитал, что не окупается при таком низком использовании клиентами
      - source: interviews/04-igor.md
        quote: Да, за модуль лояльности в Poster платил, по-моему, 890 рублей в месяц, полгода продержался, итого получилось больше пяти тысяч, и я решил, что это дорого для того эффекта, который был
      - source: interviews/05-elena.md
        quote: Перестали, потому что неудобно было сверять данные из двух разных систем — из кассы продажи, из Плазиуса лояльность, — цифры не всегда сходились друг с другом

  - id: no-pain-when-flow-stable
    claim: |
      Там, где поток клиентов и так стабилен по внешним причинам — расположение,
      привычка, — владелец не видит смысла тратить время на статистику по
      лояльности
    evidence:
      - source: interviews/03-marina.md
        quote: У нас и так люди возвращаются, потому что рядом бизнес-центры и просто удобно географически. Программа лояльности не была причиной, почему к нам ходят
      - source: interviews/03-marina.md
        quote: Наверное только то, что для меня это не больная тема вообще. У нас и так стабильный поток, я не вижу, зачем мне тратить время на статистику по повторным заказам

  - id: wants-integration-not-third-layer
    claim: |
      Владельцы с уже установленной кассовой системой не хотят добавлять ещё
      один отдельный сервис лояльности поверх неё и ждут полной интеграции или
      замены
    evidence:
      - source: interviews/05-elena.md
        quote: Интересно, но у меня уже есть Iiko, и мне важно, чтобы новая система либо интегрировалась с ней, либо полностью её заменяла вместе с кассой, а не добавлялась третьим слоем поверх, иначе я снова получу ту же проблему со сведением данных из разных мест
